[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-insight"
version = "0.1.0"
description = "arXiv ingestion, DB and RAG API"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "alembic>=1.13.1",
    "asgi-correlation-id>=4.3.1",
    "asyncpg>=0.29.0",
    "cachetools>=5.3.3",
    "fastapi>=0.111.0",
    "fastembed>=0.2.7",
    "httpx>=0.27.0",
    "lxml>=5.2.2",
    "groq>=0.13.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pydantic>=2.7.2",
    "pydantic-settings>=2.2.1",
    "slowapi>=0.1.4",
    "sqlalchemy>=2.0.30",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "typer>=0.12.3",
    "uvicorn>=0.30.1",
    "pgvector>=0.2.5",

    "limits>=5.8.0",
    "redis>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.1",
    "pytest-asyncio>=0.23.7",
    "respx>=0.21.1",
    "testcontainers[postgres]>=4.4.1"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]
pythonpath = [
    "src"
]
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"
]

[dependency-groups]
dev = [
    "greenlet>=3.5.6",
]
[project.scripts]
agy-ingest = "app.cli:app"

